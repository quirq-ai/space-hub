# spacehub server behind a Caddy TLS front.
#
#   docker compose up -d --build                           plain HTTP on :80
#   SPACEHUB_DOMAIN=hub.example.com docker compose up -d   automatic HTTPS
#   SPACEHUB_XO_KEY=... (32+ characters) also turns on xo.quirq.dev's API (README, xo);
#   SPACEHUB_ACCOUNTS=open|xo changes how people sign up (default github)
#   SPACEHUB_GITHUB_CLIENT_ID=... SPACEHUB_GITHUB_CLIENT_SECRET=... sign in with the hub's
#   GitHub OAuth App (README, Sign up with GitHub)
#
# Clients: spacehub auth login --server wss://hub.example.com   (with the GitHub account gh is logged in to)
# Admin (SQL, logs) stays inside the container:
#   docker compose exec spacehub spacetime --root-dir /data logs --server http://127.0.0.1:3001 spacehub
services:
  spacehub:
    build:
      context: .
      target: server
    image: spacehub-server
    environment:
      SPACEHUB_DB: ${SPACEHUB_DB:-spacehub}
      SPACEHUB_ACCOUNTS: ${SPACEHUB_ACCOUNTS:-github}
      SPACEHUB_XO_KEY: ${SPACEHUB_XO_KEY:-}  # empty: the xo API stays off
      SPACEHUB_GITHUB_CLIENT_ID: ${SPACEHUB_GITHUB_CLIENT_ID:-}  # both empty: sign in with gh's token
      SPACEHUB_GITHUB_CLIENT_SECRET: ${SPACEHUB_GITHUB_CLIENT_SECRET:-}
    volumes:
      - spacehub-data:/data
    restart: unless-stopped

  proxy:
    image: caddy:2.8.4
    environment:
      SPACEHUB_DOMAIN: ${SPACEHUB_DOMAIN:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "${SPACEHUB_HTTP_PORT:-80}:80"
      - "${SPACEHUB_HTTPS_PORT:-443}:443"
    depends_on:
      - spacehub
    restart: unless-stopped

volumes:
  spacehub-data:
  caddy-data:
